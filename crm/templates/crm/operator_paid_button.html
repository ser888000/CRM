{% load l10n %}{% if perms.crm.change_contract %}<button type="button" class="operator-paid-status {% if contract.operator_paid_in_full %}is-paid{% endif %}" data-operator-paid="{% url 'operator_paid_status' contract.pk %}" data-value="{{ contract.operator_paid_in_full|yesno:'1,0' }}" data-version="{{ contract.updated_at|stringformat:"s" }}" aria-pressed="{{ contract.operator_paid_in_full|yesno:'true,false' }}">{% if contract.operator_paid_in_full %}✓ Оплачено{% else %}○ Не оплачено{% endif %}</button>{% else %}<span class="operator-paid-status {% if contract.operator_paid_in_full %}is-paid{% endif %}">{{ contract.operator_paid_in_full|yesno:'Оплачено,Не оплачено' }}</span>{% endif %}
