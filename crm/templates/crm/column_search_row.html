<tr class="column-search-row">{% if task_selection %}<th data-col="select"></th>{% endif %}{% for column in columns %}<th data-col="{{ column.key }}"><input type="text" name="q_{{ column.key }}" value="{{ column.search }}" maxlength="250" placeholder="Поиск…" aria-label="Поиск в колонке: {{ column.label }}" form="journal-filters" title="Содержит текст. Нажмите Enter или «Применить фильтры колонок»."></th>{% endfor %}</tr>
