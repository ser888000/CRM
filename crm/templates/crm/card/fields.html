<div class="field-grid">{% for field in fields %}<div class="field field-{{ field.name }} {% if field.errors %}invalid{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required"> *</span>{% endif %}</label>{{ field }}{% if field.name == 'customer' and perms.crm.add_customer %}<button type="button" class="button secondary" data-new-customer>+ Новый заказчик</button>{% endif %}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}</div>
