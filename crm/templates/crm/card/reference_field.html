{% load references %}{% reference_controls field as control %}<div class="reference-control">{{ field }}{% if control.add %}<button type="button" class="reference-button" data-reference-add="{{ control.base }}" data-reference-target="{{ field.id_for_label }}" data-reference-mode="{{ control.mode }}" title="Добавить" aria-label="Добавить: {{ field.label }}">+</button>{% endif %}{% if control.change %}<button type="button" class="reference-button" data-reference-edit="{{ control.base }}" data-reference-target="{{ field.id_for_label }}" data-reference-mode="{{ control.mode }}" title="Редактировать" aria-label="Редактировать: {{ field.label }}">✎</button>{% endif %}</div>
